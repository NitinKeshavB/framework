pipeline_id: billing_invoices
domain: finance
requested_by: billing
data_domain: invoices
team: billing_squad
technical_owner: billing.owner@jll.com
layer: bronze
catalog: framework_dev
job_name: finance_billing

notify:
  on_failure:
    - billing.owner@jll.com
  on_success:
    - billing.owner@jll.com

data:
  classification: confidential
  pii:
    - pii_finance
    - pii_personal

source_to_raw:
  method: autoloader
  source:
    system: billing
    format: csv
    path: abfss://landing@storage.dfs.core.windows.net/billing/invoices/
    external_location: billing_landing
    delimiter: ","
    header: true
  raw:
    schema: billing_raw
    table: invoices

raw_to_bronze:
  bronze:
    schema: billing_bronze
    table: invoices
  dedup: true
  primary_keys:
    - invoice_id
  watermark_column: updated_at
  columns:
    - name: invoice_id
      type: string
      description: Invoice identifier from the billing system
    - name: amount
      type: decimal(18,2)
      description: Invoice amount in the source currency
      pii:
        - pii_finance
    - name: updated_at
      type: timestamp
      description: When the source system last updated the invoice
  rules:
    - name: amount_non_negative
      expression: amount >= 0

quarantine:
  schema: billing_quarantine
  table: invoices
  classification: highly_confidential

pipeline_id: payroll_timesheets
domain: people
requested_by: payroll
data_domain: timesheets
team: payroll_squad
technical_owner: payroll.owner@jll.com
layer: bronze
catalog: framework_dev
job_name: people_payroll

notify:
  on_failure:
    - payroll.owner@jll.com
  on_success:
    - payroll.owner@jll.com

data:
  classification: highly_confidential
  pii:
    - pii_personal
    - pii_basic

source_to_raw:
  method: autoloader
  source:
    system: payroll
    format: excel
    path: abfss://landing@storage.dfs.core.windows.net/payroll/timesheets/
    external_location: payroll_landing
    header_rows: 1
    data_address: Timesheets!A1
  raw:
    schema: payroll_raw
    table: timesheets

raw_to_bronze:
  bronze:
    schema: payroll_bronze
    table: timesheets
  dedup: true
  primary_keys:
    - employee_id
    - work_date
  watermark_column: updated_at
  columns:
    - name: employee_id
      type: string
    - name: work_date
      type: date
    - name: hours
      type: decimal(5,2)
    - name: updated_at
      type: timestamp
  rules:
    - name: hours_in_day
      expression: hours >= 0 AND hours <= 24

quarantine:
  schema: payroll_quarantine
  table: timesheets

pipeline_id: ledger_entries
domain: finance
project: ledger
data_domain: entries
team: ledger_squad
technical_owner: ledger.owner@jll.com
layer: bronze
catalog: framework_dev
job_name: finance_ledger

notify:
  on_failure:
    - ledger.owner@jll.com

data:
  classification: confidential
  pii:
    - pii_finance

source_to_raw:
  method: ctas
  source:
    system: ledger
    format: fixed_width
    path: s3://finance-landing/ledger/entries/
    fixed_columns:
      - name: account_id
        start: 1
        length: 10
      - name: amount
        start: 11
        length: 12
  raw:
    schema: ledger_raw
    table: entries

raw_to_bronze:
  bronze:
    schema: ledger_bronze
    table: entries
  dedup: false
  primary_keys:
    - account_id
  columns:
    - name: account_id
      type: string
    - name: amount
      type: string
  rules:
    - name: account_present
      expression: length(trim(account_id)) > 0

quarantine:
  schema: ledger_quarantine
  table: entries

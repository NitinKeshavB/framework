bundle:
  name: framework_finance

include:
  - resources/*.yml

# Same artifact as the framework bundle. Deploy builds the wheel and uploads it.
artifacts:
  framework_wheel:
    type: whl
    path: ../../framework_lff_lib
    build: python -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    default: aal_dev_fdh

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615469052932.12.azuredatabricks.net
    variables:
      catalog: aal_dev_fdh

  prod:
    mode: production
    workspace:
      host: https://adb-1864378597730899.19.azuredatabricks.net/
      root_path: /Workspace/Shared/aztech_finance
    variables:
      catalog: aal_prod_fdh
    permissions:
      - group_name: OE-AAL-ADPDBX-dev-FDH-DataEngineer
        level: CAN_MANAGE

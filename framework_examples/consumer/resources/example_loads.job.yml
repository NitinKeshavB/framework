resources:
  jobs:
    example_loads:
      name: example_loads
      email_notifications:
        on_failure:
          - orders.owner@jll.com
          - payroll.owner@jll.com
          - pricing.owner@jll.com
        on_success:
          - payroll.owner@jll.com
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: batch_load
          spark_python_task:
            python_file: ../src/run_batch.py
            parameters:
              - ../configs/bronze/orders_events.yaml
              - ../configs/bronze/payroll_timesheets.yaml
              - ../configs/bronze/price_book.yaml
          libraries:
            - whl: ../../../framework_lff_lib/dist/*.whl
        - task_key: orders_pipeline
          depends_on:
            - task_key: batch_load
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_events.id}
        - task_key: payroll_pipeline
          depends_on:
            - task_key: orders_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.payroll_timesheets.id}
        - task_key: price_pipeline
          depends_on:
            - task_key: payroll_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.price_book.id}

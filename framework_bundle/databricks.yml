# Framework bundle. Dev uses development mode. Prod uses production mode.
# The catalog is a bundle variable. Replace workspace hosts per environment before deploy.

bundle:
  name: framework_bundle

include:
  - resources/*.yml

# bundle deploy builds this wheel and uploads it. Jobs reference dist/*.whl.
# With sharding, publish the wheel once to a UC volume instead of N artifact builds (ROADMAP).
artifacts:
  framework_wheel:
    type: whl
    path: ../framework_lff_lib
    build: python -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    default: aal_dev_fdh
  system_views:
    description: >-
      true creates the cost and observed lineage views over system.billing and system.access.
      Set it on a target only once the deploying identity has SELECT on both.
    default: "false"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615469052932.12.azuredatabricks.net
    variables:
      catalog: aal_dev_fdh

  prod:
    mode: production
    workspace:
      host: https://adb-1864378597730899.19.azuredatabricks.net/
      root_path: /Workspace/Shared/aztech_framework
    variables:
      catalog: aal_dev_fdh # TEMPORARY: prod catalog not accessible from this workspace; revert to aal_prod_fdh at go-live
    # Prefer groups over personal user_name entries.
    permissions:
      - group_name: OE-AAL-ADPDBX-dev-FDH-DataEngineer
        level: CAN_MANAGE

# Framework bundle. Dev uses development mode. Prod uses production mode.
# The catalog is a bundle variable.

bundle:
  name: framework_bundle

include:
  - resources/*.yml

# bundle deploy builds this wheel and uploads it. Jobs reference dist/*.whl.
artifacts:
  framework_wheel:
    type: whl
    path: ../framework_src
    build: python -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    default: aal_dev_fdh

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615469052932.12.azuredatabricks.net
    variables:
      catalog: aal_dev_fdh

  prod:
    mode: production
    workspace:
      host: https://adb-1864378597730899.19.azuredatabricks.net/
      root_path: /Workspace/Shared/aztech_framework
    variables:
      catalog: aal_dev_fdh
    permissions:
      - user_name: OE-AAL-ADPDBX-dev-FDH-DataEngineer
        level: CAN_MANAGE
      - user_name: nitinkeshav.bolla@allianz.com.au
        level: CAN_MANAGE

resources:
  jobs:
    # All jobs here use PERFORMANCE_OPTIMIZED TEMPORARILY until go-live; revert to STANDARD then.
    framework_ddl:
      name: framework_ddl
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: apply_ddl
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/sql/framework_meta.sql
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    # Cost and observed lineage from the system tables. Needs SELECT on system.billing and
    # system.access, so it is apart from framework_ddl and off unless the target sets
    # system_views to true. When off, the condition task skips the DDL and the run succeeds.
    framework_system_views:
      name: framework_system_views
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: system_views_enabled
          condition_task:
            op: EQUAL_TO
            left: "${var.system_views}"
            right: "true"
        - task_key: apply_system_views
          depends_on:
            - task_key: system_views_enabled
              outcome: "true"
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/sql/system_views.sql
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    # Job runs hourly: prefers system.lakeflow (SELECT grant); falls back to Jobs API.
    # Pipeline updates from framework_events. Load recon is written by each pipeline's own hook.
    framework_runs:
      name: framework_runs
      performance_target: PERFORMANCE_OPTIMIZED
      # PAUSED until requested (scheduled runs fail: run_as user not a direct workspace member).
      schedule:
        quartz_cron_expression: "0 15 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: job_runs
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_runs.py
            parameters:
              - ${var.catalog}
              - job_runs
        - task_key: pipeline_updates
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_runs.py
            parameters:
              - ${var.catalog}
              - pipeline_updates
        # A pipeline writes its own load_ledger rows, but serverless can shut it down before the
        # write finishes. This writes the rows of any update that has none, from its event log.
        - task_key: load_ledger
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_runs.py
            parameters:
              - ${var.catalog}
              - load_ledger
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    # One job reloads any table: it loads the table's spec from the registry and runs the same
    # staging step as the pipeline, so rules, rule actions and the ledger match the normal load.
    # A blocked file is recorded FAILED in the ledger; the run still succeeds, with a warning.
    framework_backfill:
      name: framework_backfill
      performance_target: PERFORMANCE_OPTIMIZED
      # The defaults of table and files are patterns, so a run from the UI shows the format and the
      # user edits the parts in <angle brackets>. Run unedited, the job refuses with a message: a
      # table still holding its pattern is refused, as are files in mode files. In another mode the
      # files pattern is ignored. To add more files, put a comma between full paths. To reload every
      # file of the table, clear files and set confirm to true.
      parameters:
        - name: table # the bronze table's full name (its pipeline id works too)
          default: "${var.catalog}.<bronze_schema>.<table>"
        - name: mode # backfill: files | dates | failed | full_refresh. rescue: read files again to put rescued values back
          default: "<files|dates|failed|rescue|full_refresh>"
        - name: files # full volume paths, comma-separated (modes files and rescue)
          default: "/Volumes/${var.catalog}/<raw_schema>/<volume>/<folder>/<file>.csv"
        - name: date_from # arrival time, YYYY-MM-DD or YYYY-MM-DD HH:MM (mode dates)
          default: ""
        - name: date_to
          default: ""
        - name: dry_run # true | false. true lists the files and changes nothing
          default: "true"
        - name: confirm # true | false. true is needed for full_refresh and for no selector at all
          default: "false"
        - name: on_fail # quarantine | drop | warn | fail for this run only. Empty keeps the table's own
          default: ""
      tasks:
        - task_key: backfill
          environment_key: framework_env
          # A reload deletes and rewrites rows, so a failure is never retried on its own: the
          # ledger says what happened and someone decides.
          max_retries: 0
          spark_python_task:
            python_file: ../src/backfill.py
            parameters:
              - ${var.catalog}
              - "{{job.parameters.table}}"
              - "{{job.parameters.mode}}"
              - "{{job.parameters.files}}"
              - "{{job.parameters.date_from}}"
              - "{{job.parameters.date_to}}"
              - "{{job.parameters.dry_run}}"
              - "{{job.parameters.confirm}}"
              - "{{job.parameters.on_fail}}"
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    framework_optimize:
      name: framework_optimize
      performance_target: PERFORMANCE_OPTIMIZED
      # PAUSED until requested (scheduled runs fail: run_as user not a direct workspace member).
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: optimize
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/optimize_registry.py
            parameters:
              - ${var.catalog}
        - task_key: archive_hot
          depends_on:
            - task_key: optimize
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/archive_hot.py
            parameters:
              - ${var.catalog}
              - "90"
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl

    # Recon is load_ledger / ledger_detail / v_loads, written by each pipeline's event hook.

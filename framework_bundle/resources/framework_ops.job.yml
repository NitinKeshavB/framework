resources:
  jobs:
    framework_ddl:
      name: framework_ddl
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: apply_ddl
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/sql/framework_meta.sql
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    # Cost and observed lineage from the system tables. Needs SELECT on system.billing and
    # system.access, so it is apart from framework_ddl and off unless the target sets
    # system_views to true. When off, the condition task skips the DDL and the run succeeds.
    framework_system_views:
      name: framework_system_views
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: system_views_enabled
          condition_task:
            op: EQUAL_TO
            left: "${var.system_views}"
            right: "true"
        - task_key: apply_system_views
          depends_on:
            - task_key: system_views_enabled
              outcome: "true"
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/sql/system_views.sql
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    # Job runs from the Jobs API and pipeline updates from the event logs, hourly. Needs no
    # system table grants: the run_as identity needs CAN_VIEW on the delivery jobs.
    framework_runs:
      name: framework_runs
      performance_target: PERFORMANCE_OPTIMIZED
      schedule:
        quartz_cron_expression: "0 15 * * * ?"
        timezone_id: UTC
      tasks:
        - task_key: job_runs
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_runs.py
            parameters:
              - ${var.catalog}
              - job_runs
        - task_key: pipeline_updates
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_runs.py
            parameters:
              - ${var.catalog}
              - pipeline_updates
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl
      queue:
        enabled: true

    framework_optimize:
      name: framework_optimize
      performance_target: PERFORMANCE_OPTIMIZED
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: optimize
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/optimize_registry.py
            parameters:
              - ${var.catalog}
        - task_key: table_health
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/record_table_health.py
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl

    framework_metrics:
      name: framework_metrics
      performance_target: PERFORMANCE_OPTIMIZED
      schedule:
        quartz_cron_expression: "0 30 * * * ?"
        timezone_id: UTC
      tasks:
        - task_key: refresh_metrics
          pipeline_task:
            pipeline_id: ${resources.pipelines.framework_metrics_pipeline.id}
      queue:
        enabled: true

  pipelines:
    framework_metrics_pipeline:
      name: framework_metrics
      catalog: ${var.catalog}
      schema: framework_meta
      serverless: true
      channel: current
      continuous: false
      configuration:
        lakeflow_framework.catalog: ${var.catalog}
      libraries:
        - file:
            path: ../src/framework_metrics.py

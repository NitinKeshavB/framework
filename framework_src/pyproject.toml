############################
# --- Package Settings --- #
############################

[project]
name = "lakeflow_framework"
version = "0.1.0"
description = "Config-driven Lakeflow file ingestion. Consumers pin this wheel and supply YAML."
authors = [{ name = "NitinKeshav", email = "nitinkeshav.bolla@jll.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["lakeflow", "databricks", "ingestion", "bronze"]

[project.scripts]
lakeflow-framework = "lakeflow_framework.cli:main"

# pip install -e "framework_src[dev]"
# dev is the local tool set. test is pytest only. The wheel itself stays PyYAML.
[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["lakeflow_framework[test]", "ruff==0.17.4", "pre-commit"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lakeflow_framework*"]


##############################
# --- Code Quality Tools --- #
##############################

# Ruff settings live in ../ruff.toml so one config covers this package and the tests.
# pytest is started with -c this file from the repository root.

[tool.pytest.ini_options]
testpaths = ["../framework_tests", "../framework_examples/consumer/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["slow: workspace tests; ./run.sh test:quick does not run these"]

[mypy]
python_version = 3.11
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
# Pragmatic first pass: run mypy in CI/pre-commit so the cache stays warm and new
# modules get checked. Existing Optional/Any debt is silenced; tighten per-module later.
disable_error_code =
    assignment,
    arg-type,
    union-attr,
    index,
    var-annotated,
    list-item,
    operator,
    return-value,
    attr-defined,
    call-arg,
    misc

[mypy-pyspark.*]
ignore_missing_imports = true

[mypy-yaml.*]
ignore_missing_imports = true

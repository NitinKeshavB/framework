############################
# --- Package Settings --- #
############################

[project]
name = "lakeflow_framework"
version = "0.1.8"
description = "Config-driven Lakeflow file ingestion. Consumers pin this wheel and supply YAML."
authors = [{ name = "NitinKeshav", email = "nitinkeshav.bolla@allianz.com" }]
readme = "README.md"
# Jobs run Python 3.12 (serverless environment version 4). Pipelines may run another, and
# pip refuses a wheel whose range excludes the interpreter, so the range covers both.
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "PyYAML>=6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["lakeflow", "databricks", "ingestion", "bronze"]

[project.scripts]
lakeflow-framework = "lakeflow_framework.cli:main"

# pip install -e "framework_lff_lib[dev]"
# dev is the local tool set. test is pytest only.
[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["lakeflow_framework[test]", "ruff==0.17.4", "pre-commit", "mypy>=1.14"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lakeflow_framework*"]

[tool.setuptools.package-data]
lakeflow_framework = ["sql/*.sql"]


##############################
# --- Code Quality Tools --- #
##############################

# Ruff settings live in ../ruff.toml so one config covers this package and the tests.
# pytest is started with -c this file from the repository root.

[tool.pytest.ini_options]
testpaths = ["../framework_tests", "../framework_examples/consumer/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["slow: workspace tests; ./run.sh test:quick does not run these"]

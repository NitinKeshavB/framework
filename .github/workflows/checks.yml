name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable "framework_src[dev]"
      - name: Lint
        run: ./run.sh lint:ci
      - name: Test
        run: ./run.sh test:quick
      - name: Generated ingestion files
        run: ./run.sh generate:check
      - name: Generated project maps
        run: ./run.sh projects:check

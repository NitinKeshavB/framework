# Registers every spec in this bundle into framework_meta. ./run.sh bundle:deploy runs it.
# Hand-written: it covers the whole bundle, not one delivery, so generate does not own it.
resources:
  jobs:
    registry_sync:
      name: registry_sync
      queue:
        enabled: true
      tasks:
        - task_key: register_definitions
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/register_definitions.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "2"
            dependencies:
              - ../../framework_src/dist/*.whl

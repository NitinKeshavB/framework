# Registers every spec in this bundle into framework_meta and sets the column comments in Unity
# Catalog (tags are parked in phase 1). ./run.sh bundle:deploy runs it, and so can you, to restore
# comments after a full refresh. It is the only writer of definitions.
# Hand-written: it covers the whole bundle, not one delivery, so generate does not own it.
resources:
  jobs:
    registry_sync:
      name: registry_sync
      performance_target: PERFORMANCE_OPTIMIZED # TEMPORARY until go-live; revert to STANDARD
      queue:
        enabled: true
      tasks:
        - task_key: register_definitions
          environment_key: framework_env
          spark_python_task:
            python_file: ../src/register_definitions.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
              - framework_ingestion
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../framework_lff_lib/dist/*.whl

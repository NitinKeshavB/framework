# Generated by lakeflow-framework from source.yaml and the table specs. Do not edit.
resources:
  jobs:
    billing_daily:
      name: billing_daily
      email_notifications:
        on_failure:
        - billing.owner@jll.com
        on_success:
        - billing.owner@jll.com
        no_alert_for_skipped_runs: true
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/billing_raw/landing/
      environments:
      - environment_key: framework_env
        spec:
          environment_version: '2'
          dependencies:
          - ../../framework_src/dist/*.whl
      tasks:
      - task_key: mark_running
        environment_key: framework_env
        spark_python_task:
          python_file: ../src/run_cli.py
          parameters:
          - step
          - --owner-kind
          - source_system
          - --owner
          - billing
          - --full-name
          - billing_daily
          - --run-id
          - '{{job.run_id}}'
          - --step-no
          - '10'
          - --step-name
          - mark_running
          - --status
          - RUNNING
          - --out
          - /Volumes/${var.catalog}/framework_meta/framework_events
      - task_key: sync
        depends_on:
        - task_key: mark_running
        environment_key: framework_env
        spark_python_task:
          python_file: ../src/run_cli.py
          parameters:
          - sync
          - ${workspace.file_path}/sources/billing/billing/billing_invoices.yaml
          - --catalog
          - ${var.catalog}
          - --out
          - /Volumes/${var.catalog}/framework_meta/framework_events
      - task_key: await_registry
        depends_on:
        - task_key: sync
        environment_key: framework_env
        spark_python_task:
          python_file: ../src/run_cli.py
          parameters:
          - await-registry
          - --catalog
          - ${var.catalog}
          - --pipeline
          - billing_invoices
      - task_key: refresh_pipeline
        depends_on:
        - task_key: await_registry
        pipeline_task:
          pipeline_id: ${resources.pipelines.billing_daily_pipeline.id}
      - task_key: record_success
        depends_on:
        - task_key: refresh_pipeline
        environment_key: framework_env
        spark_python_task:
          python_file: ../src/run_cli.py
          parameters:
          - step
          - --owner-kind
          - source_system
          - --owner
          - billing
          - --full-name
          - billing_daily
          - --run-id
          - '{{job.run_id}}'
          - --step-no
          - '50'
          - --step-name
          - record_success
          - --status
          - SUCCEEDED
          - --out
          - /Volumes/${var.catalog}/framework_meta/framework_events
      - task_key: record_failure
        depends_on:
        - task_key: mark_running
        - task_key: sync
        - task_key: await_registry
        - task_key: refresh_pipeline
        run_if: AT_LEAST_ONE_FAILED
        environment_key: framework_env
        spark_python_task:
          python_file: ../src/run_cli.py
          parameters:
          - step
          - --owner-kind
          - source_system
          - --owner
          - billing
          - --full-name
          - billing_daily
          - --run-id
          - '{{job.run_id}}'
          - --step-no
          - '90'
          - --step-name
          - record_failure
          - --status
          - FAILED
          - --failure-reason
          - task failed
          - --out
          - /Volumes/${var.catalog}/framework_meta/framework_events

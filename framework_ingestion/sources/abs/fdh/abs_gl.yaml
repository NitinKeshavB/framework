# yaml-language-server: $schema=../../../../.schemas/table-spec.v1.json
# ABS GL extract: CSV from the abs gl_source_extract volume to bronze, every column as a string.
# Not written here, because ../source.yaml and the folder already say it: domain, layer, the raw
# schema (abs_raw), delivery and job (abs_daily), requested_by and team (fdh). Set one here only
# to override it.

spec_version: 1
pipeline_id: abs_gl                  # must start with the source system name: abs_, and be unique
data_domain: gl_accounting           # identifier: letters, digits, underscore
description: General ledger extract from the abs gl_source_extract volume, all columns as text.

# Who owns and hears about this table. Without these the source owner (sonia.rajeev@...) is used.
technical_owner: nitinkeshav.bolla@allianz.com.au
notify:
  on_failure:                        # default is the technical owner
    - nitinkeshav.bolla@allianz.com.au
  # on_success: []

# Sensitivity of this table's data.
data:
  classification: internal           # internal | confidential | highly_confidential
  pii:                               # pii_health | pii_basic | pii_finance | pii_biometric | pii_personal
    - pii_finance

# The files: /Volumes/<catalog>/abs_raw/<volume>/<raw_path>. The catalog comes from the bundle.
source:
  volume: gl_source_extract          # a volume in the abs_raw schema
  # raw_path: month_end/             # a folder inside the volume; omitted: the files are in the volume itself
  format: csv                        # csv | delimited | text | json | parquet | avro | excel
  delimiter: ","                     # required for csv and delimited
  header: true                       # default true
  # max_files_per_trigger: 100
  path_glob: "*.csv"

raw_to_bronze:
  bronze:
    schema: abs_bronze               # default is <source>_bronze
    table: gl_abs                    # default is the pipeline_id
  # How rows are taken: insert_only (append) | scd1 (upsert on primary_keys) | scd2 (keep history)
  # | full_refresh (database tables). Omitted: insert_only for files.
  load_type: insert_only
  # Declaring the columns turns type inference off, so every column lands as the type given here.
  # A value that cannot be read as that type goes to _rescued_data instead of failing the load.
  columns:
    - { name: ride_id, type: string, description: Unique id of the ride }
    - { name: rideable_type, type: string, description: Kind of bike used }
    - { name: started_at, type: string, description: When the ride started, as text }
    - { name: ended_at, type: string, description: When the ride ended, as text }
    - { name: start_station_name, type: string, description: Name of the station the ride started at }
    - { name: start_station_id, type: string, description: Id of the station the ride started at }
    - { name: end_station_name, type: string, description: Name of the station the ride ended at }
    - { name: end_station_id, type: string, description: Id of the station the ride ended at }
    - { name: start_lat, type: string, description: Latitude of the start, as text }
    - { name: start_lng, type: string, description: Longitude of the start, as text }
    - { name: end_lat, type: string, description: Latitude of the end, as text }
    - { name: end_lng, type: string, description: Longitude of the end, as text }
    - { name: member_casual, type: string, description: Whether the rider is a member or casual }
  # Every bronze and quarantine table also gets, with no setting needed: _src_file_path,
  # _src_file_name, _src_row_hash, _batch_id and _ingest_timestamp (and _rescued_data for files).
  # Two rules per column. A row that fails any rule goes to quarantine, with the names of the rules
  # it failed. A rule must be true for a good row, and a null result counts as a failure, so a
  # column that may be empty says so with "IS NULL OR ...". Columns are text, so numbers and times
  # are checked by pattern or with try_cast.
  rules:
    - { name: ride_id_present, expression: "ride_id IS NOT NULL AND length(trim(ride_id)) > 0" }
    - { name: ride_id_format, expression: "ride_id rlike '^[0-9A-Fa-f]{16}$'" }
    - { name: rideable_type_present, expression: "rideable_type IS NOT NULL AND length(trim(rideable_type)) > 0" }
    - { name: rideable_type_known, expression: "rideable_type IN ('classic_bike', 'electric_bike', 'docked_bike')" }
    - { name: started_at_present, expression: "started_at IS NOT NULL AND length(trim(started_at)) > 0" }
    - { name: started_at_is_timestamp, expression: "try_cast(started_at AS timestamp) IS NOT NULL" }
    - { name: ended_at_is_timestamp, expression: "try_cast(ended_at AS timestamp) IS NOT NULL" }
    - { name: ended_not_before_started, expression: "try_cast(ended_at AS timestamp) >= try_cast(started_at AS timestamp)" }
    - { name: start_station_name_present, expression: "start_station_name IS NOT NULL AND length(trim(start_station_name)) > 0" }
    - { name: start_station_name_length, expression: "length(start_station_name) <= 200" }
    - { name: start_station_id_present, expression: "start_station_id IS NOT NULL AND length(trim(start_station_id)) > 0" }
    - { name: start_station_id_length, expression: "length(start_station_id) <= 50" }
    - { name: end_station_name_not_blank, expression: "end_station_name IS NULL OR length(trim(end_station_name)) > 0" }
    - { name: end_station_name_length, expression: "end_station_name IS NULL OR length(end_station_name) <= 200" }
    - { name: end_station_id_not_blank, expression: "end_station_id IS NULL OR length(trim(end_station_id)) > 0" }
    - { name: end_station_id_length, expression: "end_station_id IS NULL OR length(end_station_id) <= 50" }
    - { name: start_lat_is_number, expression: "start_lat rlike '^-?[0-9]+([.][0-9]+)?$'" }
    - { name: start_lat_in_range, expression: "start_lat rlike '^-?(([0-8]?[0-9])([.][0-9]+)?|90([.]0+)?)$'" }
    - { name: start_lng_is_number, expression: "start_lng rlike '^-?[0-9]+([.][0-9]+)?$'" }
    - { name: start_lng_in_range, expression: "start_lng rlike '^-?((1[0-7][0-9]|[0-9]{1,2})([.][0-9]+)?|180([.]0+)?)$'" }
    - { name: end_lat_is_number, expression: "end_lat IS NULL OR end_lat rlike '^-?[0-9]+([.][0-9]+)?$'" }
    - { name: end_lat_in_range, expression: "end_lat IS NULL OR end_lat rlike '^-?(([0-8]?[0-9])([.][0-9]+)?|90([.]0+)?)$'" }
    - { name: end_lng_is_number, expression: "end_lng IS NULL OR end_lng rlike '^-?[0-9]+([.][0-9]+)?$'" }
    - { name: end_lng_in_range, expression: "end_lng IS NULL OR end_lng rlike '^-?((1[0-7][0-9]|[0-9]{1,2})([.][0-9]+)?|180([.]0+)?)$'" }
    - { name: member_casual_present, expression: "member_casual IS NOT NULL AND length(trim(member_casual)) > 0" }
    - { name: member_casual_known, expression: "member_casual IN ('member', 'casual')" }

# Failed rows go to abs_bronze.gl_abs_qrntn: the bronze schema, the bronze table plus _qrntn.
# Add a quarantine block only to change that:
# quarantine:
#   schema: abs_quarantine
#   table: gl_abs_rejects

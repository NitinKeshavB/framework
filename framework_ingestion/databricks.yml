# Source ingestion bundle: source -> raw -> bronze. Domain-owned, shared by projects.
# It needs the framework bundle deployed first (framework_meta must exist).
# Catalog must match the framework bundle's catalog for the same target.
# Workspace hosts and catalog names are environment-specific — replace before first deploy.

bundle:
  name: framework_ingestion

include:
  # Hand-written (registry_sync). Generated jobs/pipelines live under .build/ (gitignored);
  # ./run.sh bundle:validate|deploy regenerates them first.
  - resources/*.yml
  - .build/resources/*.yml

# .build/ is gitignored, and bundle sync skips gitignored files. The generated pipeline entrypoints
# and delivery manifests are read from the workspace at run time, so upload them explicitly.
sync:
  include:
    - .build/pipelines/*.py
    - .build/manifests/*.json

# Same artifact as the framework bundle. Prefer a UC-volume wheel once published once per
# wave (see ROADMAP); until then each bundle rebuilds from framework_lff_lib.
artifacts:
  framework_wheel:
    type: whl
    path: ../framework_lff_lib
    build: python -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    default: aal_dev_fdh

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615469052932.12.azuredatabricks.net
    variables:
      catalog: aal_dev_fdh

  prod:
    mode: production
    workspace:
      host: https://adb-1864378597730899.19.azuredatabricks.net/
      root_path: /Workspace/Shared/aztech_ingestion
    variables:
      catalog: aal_dev_fdh
    presets:
      name_prefix: '[fdh] '
    # Prefer groups over personal user_name entries.
    permissions:
      - group_name: OE-AAL-ADPDBX-dev-FDH-DataEngineer
        level: CAN_MANAGE
      - user_name: adm_ye9z286@allianzms.onmicrosoft.com
        level: CAN_MANAGE
